[project]
name = "weekly-report-backend"
version = "0.1.0"
description = "Backend orchestrator for DaoStore ppt2video weekly report generation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pillow>=10.4.0",
  "pymysql>=1.1.1",
  "pydantic-settings>=2.4.0",
  "uvicorn[standard]>=0.30.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
